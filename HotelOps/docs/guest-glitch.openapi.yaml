openapi: 3.0.3
info:
  title: HotelOps Guest Glitch API
  version: 1.0.0
servers:
  - url: /api/GuestGlitch
security:
  - bearerAuth: []
paths:
  /create:
    post:
      summary: Create a guest glitch
      x-permission: GuestGlitch.Create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestGlitchCreate' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/GuestGlitchCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /list:
    get:
      summary: Filter and paginate guest glitches
      x-permission: GuestGlitch.View
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: departmentIds, in: query, description: Comma-separated department IDs, schema: { type: string, example: '1,2,3' } }
        - { name: sortBy, in: query, schema: { type: string, enum: [ID, EntryDate, Status, RoomNumber, GuestName, CreatedDate, ModifyDate], default: EntryDate } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /get/{id}:
    get:
      summary: Get one organization-scoped guest glitch
      x-permission: GuestGlitch.View
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /update:
    put:
      summary: Update a guest glitch using a body ID
      x-permission: GuestGlitch.Update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ID'
                - $ref: '#/components/schemas/GuestGlitchCreate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delete:
    delete:
      summary: Soft-delete a guest glitch
      x-permission: GuestGlitch.Delete
      requestBody: { $ref: '#/components/requestBodies/IDBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /status-update:
    patch:
      summary: Move a guest glitch to its next configured status
      x-permission: GuestGlitch.StatusUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ID, Status]
              properties:
                ID: { type: integer, format: int64, minimum: 1 }
                Status: { type: string, enum: [In Progress, Resolved, Closed] }
                ResolvedBy: { type: string, maxLength: 60 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /options/list:
    get:
      summary: List active organization Guest Glitch options
      x-permission: GuestGlitch.View
      parameters:
        - name: OptionType
          in: query
          required: false
          schema: { type: string, enum: [Status, GuestStatus, ComplaintSource, RaiseSource, ProcessLapseCategory, InternalActionTakenCategory] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /options/upsert:
    post:
      summary: Create or update an organization Guest Glitch option
      x-permission: GuestGlitch.OptionManage
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /report:
    get:
      summary: Compact Guest Glitch report
      x-permission: GuestGlitch.Report
      parameters: &reportFilters
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: departmentIds, in: query, description: Comma-separated unique positive IDs, schema: { type: string } }
        - { name: roomNumber, in: query, schema: { type: string } }
        - { name: guestName, in: query, schema: { type: string } }
        - { name: complaint, in: query, schema: { type: string } }
        - { name: complaintSource, in: query, schema: { type: string } }
        - { name: raiseSource, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string, enum: [ID, Hotel, EntryDate, RoomNumber, GuestName, Status, Rate, CreatedDate, ModifyDate], default: EntryDate } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /report/{id}:
    get:
      summary: Complete Guest Glitch report detail
      x-permission: GuestGlitch.Report
      parameters: &idPath
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /master-report:
    get:
      summary: Complete Guest Glitch master report
      x-permission: GuestGlitch.MasterReport
      parameters: *reportFilters
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /master-report/{id}/pdf:
    get:
      summary: Generate an inline single-record master report PDF
      x-permission: GuestGlitch.MasterReport
      parameters: *idPath
      responses:
        '200':
          description: PDF document
          headers:
            Content-Disposition: { schema: { type: string }, example: 'inline; filename="guest-glitch-1001.pdf"' }
          content: { application/pdf: { schema: { type: string, format: binary } } }
  /gm/{id}:
    get:
      summary: Guest Glitch detail for GM action
      x-permission: GuestGlitch.GMAction
      parameters: *idPath
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /gm-action:
    patch:
      summary: Save GM comment and optionally perform a configured status transition
      x-permission: GuestGlitch.GMAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ID, GMComment]
              properties:
                ID: { type: integer, minimum: 1 }
                GMComment: { type: string, maxLength: 500 }
                Status: { type: string }
                ResolvedBy: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /attachment/{id}:
    get:
      summary: Create a one-hour attachment SAS URL
      x-permission: GuestGlitch.AttachmentView
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: disposition, in: query, schema: { type: string, enum: [inline, attachment], default: inline } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  requestBodies:
    IDBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ID' }
  schemas:
    ID:
      type: object
      required: [ID]
      properties:
        ID: { type: integer, format: int64, minimum: 1 }
    HODComment:
      type: object
      required: [departmentId, comment]
      properties:
        departmentId: { type: integer, format: int64, minimum: 1 }
        comment: { type: string, maxLength: 500 }
    GuestGlitchCreate:
      type: object
      required: [GuestStatus, RoomNumber, GuestName, Complaint, DepartmentIDs, ReceivedByIDs, InformedToIDs, Time]
      properties:
        GuestStatus: { type: string }
        RoomNumber: { type: string, maxLength: 60 }
        GuestName: { type: string, maxLength: 60 }
        Complaint: { type: string }
        DepartmentIDs: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 1 } }
        ReceivedByIDs: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 1 } }
        InformedToIDs: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 1 } }
        DepartmentHODComments: { type: array, items: { $ref: '#/components/schemas/HODComment' } }
        Time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        EntryDate: { type: string, format: date }
        CompanyName: { type: string, maxLength: 150 }
        Rate: { type: number, minimum: 0 }
        CheckInDate: { type: string, format: date }
        CheckOutDate: { type: string, format: date }
        Attachment: { type: string, format: binary }
    GuestGlitchList:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 10 }
        search: { type: string }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        status: { type: string }
        departmentIds: { type: array, items: { type: integer } }
        sortBy: { type: string, enum: [ID, EntryDate, Status, RoomNumber, GuestName, CreatedDate, ModifyDate] }
        sortDirection: { type: string, enum: [ASC, DESC] }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties: { success: { type: boolean }, message: { type: string }, data: {} }
    ValidationError:
      description: Validation or business-rule failure
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: Validation failed. }
              errors: { type: array, items: { type: object } }
    Unauthorized: { description: Missing or invalid authentication token }
    Forbidden: { description: Permission or organization access denied }
    NotFound: { description: Guest glitch record not found }
    Unavailable: { description: Service temporarily unavailable }
